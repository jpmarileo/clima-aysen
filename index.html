<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Aysén + Puertos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="max-w-2xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">🌧️ Clima Aysén XI Región</h1>
    
    <div id="clima-actual" class="bg-gray-800 rounded-2xl p-6 mb-6"></div>
    
    <div id="pronostico" class="mb-6"></div>
    
    <div id="puertos" class="bg-red-900/50 rounded-2xl p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">🚢 Estado Puertos</h2>
      <div id="lista-puertos"></div>
    </div>
    
    <div id="mapa" class="h-64 rounded-2xl overflow-hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
